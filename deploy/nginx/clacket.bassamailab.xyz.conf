# /etc/nginx/sites-available/clacket.bassamailab.xyz
# Static page, no backend. Releases live in /var/www/clacket/releases/<stamp>; "current" is a symlink.
# Certbot adds the 443/TLS lines to this file; do not copy this file over the live one afterwards.

server {
    # IPv4 only, like the other sites on this server (the domain has no AAAA record).
    listen 80;
    server_name clacket.bassamailab.xyz;

    root  /var/www/clacket/current;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/clacket.access.log;
    error_log  /var/log/nginx/clacket.error.log warn;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # add_header is NOT inherited into a location that has its own add_header,
    # so every location includes the same security headers snippet.
    include snippets/clacket-security-headers.conf;

    # pdf.js ships as .mjs modules. Browsers refuse a module with the wrong type,
    # and older nginx builds do not know .mjs.
    location ~ \.mjs$ {
        include snippets/clacket-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        types { }
        default_type text/javascript;
        try_files $uri =404;
    }

    # Fonts never change under the same name.
    location /assets/fonts/ {
        include snippets/clacket-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # File names are not hashed, so everything else revalidates: a new release shows at once.
    location / {
        include snippets/clacket-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    # Hidden files are never served.
    location ~ /\. { deny all; }
}
