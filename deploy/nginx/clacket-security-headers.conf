# /etc/nginx/snippets/clacket-security-headers.conf
# The page makes no network calls after loading. pdf.js runs in a worker from this site.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# After HTTPS has worked for a day: remove the "#" below. Do not add includeSubDomains.
# add_header Strict-Transport-Security "max-age=31536000" always;
